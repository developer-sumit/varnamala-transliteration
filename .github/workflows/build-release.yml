name: Build Release APK

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Decode Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Create key.properties
        if: ${{ env.KEYSTORE_PASSWORD != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "storeFile=../keystore.jks" > key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> key.properties
          echo "keyAlias=$KEY_ALIAS" >> key.properties
          echo "keyPassword=$KEY_PASSWORD" >> key.properties

      - name: Build Release APKs (All ABIs)
        run: ./gradlew assembleRelease

      - name: List APK files
        run: |
          echo "=== Release APKs ==="
          find app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: varnamala-${{ steps.get_version.outputs.VERSION }}-arm64-v8a
          path: app/build/outputs/apk/release/*-arm64-v8a-*.apk
          if-no-files-found: warn

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: varnamala-${{ steps.get_version.outputs.VERSION }}-armeabi-v7a
          path: app/build/outputs/apk/release/*-armeabi-v7a-*.apk
          if-no-files-found: warn

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: varnamala-${{ steps.get_version.outputs.VERSION }}-x86
          path: app/build/outputs/apk/release/*-x86-*.apk
          if-no-files-found: warn

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: varnamala-${{ steps.get_version.outputs.VERSION }}-x86_64
          path: app/build/outputs/apk/release/*-x86_64-*.apk
          if-no-files-found: warn

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: varnamala-${{ steps.get_version.outputs.VERSION }}-universal
          path: app/build/outputs/apk/release/*-universal-*.apk
          if-no-files-found: warn

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: varnamala-${{ steps.get_version.outputs.VERSION }}-all-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
