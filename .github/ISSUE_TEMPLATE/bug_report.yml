name: Bug Report
description: Create a report to help us improve Varnamala
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting an issue! Please describe what happened.
  - type: input
    id: device-info
    attributes:
      label: Device & OS Version
      placeholder: e.g. Pixel 8, Android 15
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: 1. Go to...\n2. Click on...\n3. See error...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      placeholder: What did you expect to happen?
    validations:
      required: true
