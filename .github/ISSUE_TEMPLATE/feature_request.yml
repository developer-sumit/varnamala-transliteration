name: Feature Request
description: Suggest an idea or enhancement for Varnamala
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for sharing ideas to make Varnamala better!
  - type: textarea
    id: problem-statement
    attributes:
      label: Is your feature request related to a problem?
      placeholder: A clear and concise description of the problem or limitation.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Describe the solution you'd like
      placeholder: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      placeholder: Add any other context, mockups, or screenshots about the feature request.
    validations:
      required: false
